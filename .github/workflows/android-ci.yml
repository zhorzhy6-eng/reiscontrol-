name: Android CI

on: [push, pull_request]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, unit tests and debug APK
        run: bash ./gradlew ktlintCheck testDebugUnitTest :core:common:test :core:rules:test :app:assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: reiscontrol-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
