name: Backend CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Ruff
        run: python -m ruff check --config backend/pyproject.toml backend tests
      - name: Black
        run: python -m black --check --config backend/pyproject.toml backend tests
      - name: Placeholder tests
        run: python -m pytest tests/unit tests/integration tests/e2e
