services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reiscontrol}
      POSTGRES_USER: ${POSTGRES_USER:-reiscontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reiscontrol_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # Community MinIO built from the official 2025-10-15 source; upstream images were removed.
    image: soldevelo/minio:2025.10.15@sha256:0f8687550531a9eae9654a69e5f5afe0d96e3f16a6455367dfc53d766dc25f6d
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reiscontrol_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reiscontrol_local_secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  minio-init:
    image: soldevelo/minio:2025.10.15@sha256:0f8687550531a9eae9654a69e5f5afe0d96e3f16a6455367dfc53d766dc25f6d
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reiscontrol_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reiscontrol_local_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-reiscontrol}
      MC_CONFIG_DIR: /tmp/mc
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
      mc mb --ignore-existing "local/$$MINIO_BUCKET";
      '

volumes:
  postgres_data:
  minio_data:
