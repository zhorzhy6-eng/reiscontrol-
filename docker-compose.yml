services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reiscontrol}
      POSTGRES_USER: ${POSTGRES_USER:-reiscontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reiscontrol_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reiscontrol_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reiscontrol_local_secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-reiscontrol_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-reiscontrol_local_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-reiscontrol}
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
      mc mb --ignore-existing "local/$$MINIO_BUCKET";
      '

volumes:
  postgres_data:
  minio_data:
